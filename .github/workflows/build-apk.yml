name: Build APK

on:
  push:
    branches: [main, claude/untitled-session-hrxf6u]
    paths: ['index.html', 'version.json', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check version.json matches the game
        run: |
          node -e "
            const v = require('./version.json').version;
            const html = require('fs').readFileSync('index.html', 'utf8');
            if (!html.includes(\"const GAME_VERSION = '\" + v + \"'\")) { console.error('version.json (' + v + ') does not match GAME_VERSION in index.html'); process.exit(1); }
            console.log('Version ' + v);
          "

      - name: Prepare web files (inline Tailwind and Three.js so the app works offline)
        run: |
          mkdir -p app/www
          cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 tailwindcss@3.4.17 three@0.149.0
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tw-input.css
          echo "module.exports = { content: ['../index.html'] };" > tailwind.config.js
          npx tailwindcss -c tailwind.config.js -i tw-input.css -o tw-out.css --minify
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('../index.html', 'utf8');
            const css = fs.readFileSync('tw-out.css', 'utf8');
            const three = fs.readFileSync('node_modules/three/build/three.min.js', 'utf8');
            const tag = '<script src=\"https://cdn.tailwindcss.com\"></script>';
            const threeTag = '<script src=\"https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js\"></script>';
            if (!html.includes(tag) || !html.includes(threeTag)) { console.error('CDN tags not found'); process.exit(1); }
            const out = html.split(tag).join('<style>' + css + '</style>').split(threeTag).join('<script>' + three + '</script>');
            fs.writeFileSync('www/index.html', out);
          "

      - name: Create Android project
        run: |
          cd app
          echo '{"appId":"com.tiemdoan.tinyfastfood","appName":"Tiny Fast-Food Story","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q 'sensorLandscape' android/app/src/main/AndroidManifest.xml
          VER=$(node -p "require('../version.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          npx cap sync android

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../TinyFastFoodStory.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TinyFastFoodStory-apk
          path: TinyFastFoodStory.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./version.json').version")
          node -e "
            const v = require('./version.json');
            const lines = ['## Tiny Fast-Food Story v' + v.version + ' – ' + v.title, '', ...v.notes.map((n) => '- ' + n), '', 'Tải **TinyFastFoodStory.apk** về điện thoại Android rồi mở để cài.', '', 'Bản build từ commit ${{ github.sha }}.'];
            require('fs').writeFileSync('release-notes.md', lines.join('\\n'));
          "
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest TinyFastFoodStory.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Tiny Fast-Food Story v$VER – APK mới nhất" \
            --notes-file release-notes.md
