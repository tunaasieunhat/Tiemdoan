name: Build APK

on:
  push:
    branches: [main, claude/untitled-session-hrxf6u]
    paths: ['index.html', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (inline Tailwind so the app works offline)
        run: |
          mkdir -p app/www
          cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 tailwindcss@3.4.17
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tw-input.css
          echo "module.exports = { content: ['../index.html'] };" > tailwind.config.js
          npx tailwindcss -c tailwind.config.js -i tw-input.css -o tw-out.css --minify
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('../index.html', 'utf8');
            const css = fs.readFileSync('tw-out.css', 'utf8');
            const tag = '<script src=\"https://cdn.tailwindcss.com\"></script>';
            if (!html.includes(tag)) { console.error('Tailwind tag not found'); process.exit(1); }
            fs.writeFileSync('www/index.html', html.split(tag).join('<style>' + css + '</style>'));
          "

      - name: Create Android project
        run: |
          cd app
          echo '{"appId":"com.tiemdoan.tinyfastfood","appName":"Tiny Fast-Food Story","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../TinyFastFoodStory.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TinyFastFoodStory-apk
          path: TinyFastFoodStory.apk

      - name: Publish to the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest TinyFastFoodStory.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Tiny Fast-Food Story – APK mới nhất" \
            --notes "File APK tự build từ index.html (commit ${{ github.sha }}). Tải TinyFastFoodStory.apk về điện thoại Android rồi mở để cài."
